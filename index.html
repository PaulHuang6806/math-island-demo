<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#58cc02">
<title>数学游戏盒 · 闯关</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Nunito",system-ui,sans-serif;
    background:#fdf9f0; color:#4b4b4b;
    display:flex; justify-content:center;
  }
  #app { width:100%; max-width:480px; min-height:100vh; position:relative; background:#fdf9f0; box-shadow:0 0 24px rgba(0,0,0,.08); overflow:hidden; }
  .hidden { display:none !important; }
  .screen { min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- 背景装饰（云朵/气球/星星，纯装饰不干扰主题） ---------- */
  #app::before, #app::after {
    content:""; position:fixed; left:50%; pointer-events:none; z-index:0;
    background-repeat:no-repeat; background-size:contain;
  }
  #app::before { /* 淡蓝云朵1 */
    top:6%; width:110px; height:46px; margin-left:-210px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 40'><ellipse cx='25' cy='28' rx='20' ry='11' fill='%23dcebff'/><ellipse cx='50' cy='20' rx='24' ry='15' fill='%23dcebff'/><ellipse cx='70' cy='28' rx='18' ry='10' fill='%23dcebff'/></svg>") no-repeat center;
  }
  #app::after { /* 淡蓝云朵2 */
    top:30%; width:80px; height:36px; margin-left:200px; opacity:.7;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 70 32'><ellipse cx='20' cy='22' rx='16' ry='9' fill='%23dcebff'/><ellipse cx='38' cy='16' rx='19' ry='12' fill='%23dcebff'/><ellipse cx='55' cy='22' rx='14' ry='8' fill='%23dcebff'/></svg>") no-repeat center;
  }
  /* 角落里的小气球与星星（低透明度，纯氛围） */
  .screen::before, .screen::after {
    content:""; position:absolute; pointer-events:none; z-index:0; opacity:.5; font-size:34px;
  }
  .screen::before { content:"🎈"; top:44%; left:6%; transform:rotate(-14deg); }
  .screen::after { content:"⭐"; top:64%; right:7%; font-size:24px; opacity:.35; }
  .screen { position:relative; z-index:1; }

  /* ---------- 通用按钮（多邻国 3D 按压感） ---------- */
  .btn {
    border:none; border-radius:16px; font-size:17px; font-weight:800;
    padding:13px 22px; cursor:pointer; letter-spacing:1px;
    color:#fff; background:#58cc02; box-shadow:0 4px 0 #46a302;
    transition:transform .06s, box-shadow .06s; font-family:inherit;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #46a302; }
  .btn.gray { background:#e5e5e5; color:#777; box-shadow:0 4px 0 #c9c9c9; }
  .btn.gray:active { box-shadow:0 1px 0 #c9c9c9; }
  .btn.blue { background:#1cb0f6; box-shadow:0 4px 0 #1899d6; }
  .btn.blue:active { box-shadow:0 1px 0 #1899d6; }

  /* ---------- 顶栏 ---------- */
  header {
    position:sticky; top:0; z-index:10; background:rgba(255,255,255,.96);
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .thumb-badge {
    width:42px; height:42px; border-radius:50%; background:#f0f0f0;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    filter:grayscale(1); opacity:.45; border:2px dashed #d0d0d0;
  }
  .thumb-badge.silver { background:#fdf3e3; border-color:#e8c57a; filter:grayscale(.4) sepia(.4); opacity:1; }
  .thumb-badge.gold { background:#fff3d6; border-color:#ffc800; filter:none; opacity:1; box-shadow:0 0 0 3px rgba(255,200,0,.25); }
  .xp-wrap { flex:1; display:flex; align-items:center; gap:8px; }
  .xp-bar { flex:1; height:14px; background:#f0e8da; border-radius:9px; overflow:hidden; border:2px solid #eaddc8; }
  .xp-bar > div { height:100%; width:0%; background:linear-gradient(90deg,#ffc800,#ff9600); border-radius:7px; transition:width .5s; }
  #hdr-xp-text { font-size:12px; font-weight:800; color:#ff9600; white-space:nowrap; }
  .hdr-btn { border:none; background:#fff; border:2px solid #e5e5e5; border-radius:14px; padding:8px 12px; font-weight:800; color:#1cb0f6; font-size:14px; cursor:pointer; font-family:inherit; }
  .hdr-title { font-size:18px; font-weight:900; color:#4b4b4b; flex:1; text-align:center; }
  #btn-quit, #btn-back-map { border:none; background:none; font-size:20px; color:#afafaf; cursor:pointer; font-weight:900; }

  /* ---------- 地图 ---------- */
  .map-title { text-align:center; padding:18px 0 4px; font-weight:900; font-size:22px; color:#3c3c3c; }
  .map-sub { text-align:center; font-size:12px; color:#afafaf; margin-bottom:10px; }
  .map-mascot-wrap { display:flex; justify-content:center; margin:4px 0 6px; }
  #path { display:flex; flex-direction:column; align-items:center; gap:34px; padding:40px 0 40px; position:relative; }
  /* 节点间的虚线小径（草地） */
  #path::before {
    content:""; position:absolute; top:56px; bottom:56px; left:50%;
    border-left:3px dashed #d8e9c0; z-index:0;
  }
  .node-wrap { position:relative; z-index:1; }
  .node {
    width:78px; height:78px; border-radius:50%; border:none; cursor:pointer;
    font-size:32px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 0 rgba(0,0,0,.18); transition:transform .1s;
    position:relative; font-family:inherit;
  }
  .node:active { transform:scale(.94); }
  .node.green { background:#58cc02; } .node.blue { background:#1cb0f6; }
  .node.brown { background:#b08968; } .node.purple { background:#ce82ff; }
  .node.locked { background:#e5e5e5; box-shadow:0 6px 0 #cfcfcf; cursor:default; }
  .node.current { animation:pulse 1.6s infinite; }
  @keyframes pulse {
    0% { box-shadow:0 6px 0 rgba(0,0,0,.18), 0 0 0 0 rgba(88,204,2,.45); }
    70% { box-shadow:0 6px 0 rgba(0,0,0,.18), 0 0 0 16px rgba(88,204,2,0); }
    100% { box-shadow:0 6px 0 rgba(0,0,0,.18), 0 0 0 0 rgba(88,204,2,0); }
  }
  .node-stars { position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:4px; font-size:14px; letter-spacing:2px; white-space:nowrap; }
  .node-name { position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:24px; font-size:13px; font-weight:800; color:#7a7a7a; white-space:nowrap; }
  .start-bubble {
    position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%);
    background:#58cc02; color:#fff; font-weight:900; font-size:14px;
    padding:7px 16px; border-radius:12px; white-space:nowrap;
    animation:bob 1s infinite alternate;
  }
  .start-bubble:after {
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:7px solid transparent; border-top-color:#58cc02;
  }
  @keyframes bob { from { margin-bottom:0; } to { margin-bottom:7px; } }
  footer { text-align:center; font-size:12px; color:#c5c5c5; padding:10px 16px 30px; }

  /* ---------- 小狐狸吉祥物 ---------- */
  .mascot {
    display:inline-block; position:relative; width:110px; height:96px;
    animation:mascot-idle 2.4s ease-in-out infinite;
  }
  @keyframes mascot-idle { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-5px) } }
  .mascot .m-tail { transform-origin:82px 78px; animation:mascot-wag 1.2s ease-in-out infinite; }
  @keyframes mascot-wag { 0%,100%{ transform:rotate(0deg) } 50%{ transform:rotate(14deg) } }
  .mascot .m-eye { animation:mascot-blink 3.6s infinite; transform-origin:center; }
  @keyframes mascot-blink { 0%,90%,100%{ transform:scaleY(1) } 93%,96%{ transform:scaleY(.08) } }
  .mascot.jump { animation:mascot-jump .6s ease; }
  @keyframes mascot-jump { 0%{transform:translateY(0)} 40%{transform:translateY(-26px)} 70%{transform:translateY(4px)} 100%{transform:translateY(0)} }
  /* 说话气泡 */
  .bubble {
    position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
    background:#fff; border:2px solid #ffe0b0; color:#6b4f2a;
    font-size:14px; font-weight:800; padding:8px 14px; border-radius:14px;
    white-space:nowrap; box-shadow:0 3px 8px rgba(0,0,0,.08);
    animation:bubble-pop .3s ease; z-index:5;
  }
  .bubble:after {
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:7px solid transparent; border-top-color:#ffe0b0;
  }
  @keyframes bubble-pop { from { transform:translateX(-50%) scale(.6); opacity:0; } }
  /* 地图底部小狐狸 */
  .mascot-stage { display:flex; justify-content:center; margin-bottom:8px; }

  /* ---------- 游戏页 ---------- */
  .game-hdr { display:flex; align-items:center; gap:12px; }
  .prog { flex:1; height:14px; background:#f0e8da; border-radius:9px; overflow:hidden; border:2px solid #eaddc8; }
  .prog > div { height:100%; width:0%; background:#58cc02; border-radius:7px; transition:width .4s; }
  .combo { font-weight:900; color:#ff9600; font-size:15px; white-space:nowrap; }
  #game-body { flex:1; display:flex; flex-direction:column; align-items:center; padding:22px 18px 110px; gap:20px; }
  .q-title { font-size:20px; font-weight:900; color:#3c3c3c; text-align:center; }
  .q-sub { font-size:14px; color:#9a9a9a; font-weight:700; text-align:center; }

  .duo-cards { display:flex; gap:18px; justify-content:center; }
  .duo-card {
    background:#fff; border:2px solid #e5e5e5; border-radius:18px;
    padding:14px 12px; min-width:130px; min-height:130px; cursor:pointer;
    display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:4px;
    font-size:26px; box-shadow:0 3px 0 #e0e0e0; transition:transform .1s;
  }
  .duo-card:active { transform:scale(.96); }
  .duo-card.shake { animation:shake .4s; border-color:#ff9600; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  .duo-card.pop { animation:pop .4s; border-color:#58cc02; background:#f2ffe8; }
  @keyframes pop { 50% { transform:scale(1.08); } }

  .opts { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:340px; }
  .opt {
    border:none; border-radius:14px; background:#fff; border:2px solid #e5e5e5;
    box-shadow:0 3px 0 #e0e0e0; padding:14px 8px; font-size:20px; font-weight:900;
    color:#4b4b4b; cursor:pointer; font-family:inherit; transition:transform .1s;
  }
  .opt:active { transform:scale(.96); }
  .opt.dead { opacity:.35; pointer-events:none; }
  .opt.good { background:#f2ffe8; border-color:#58cc02; color:#58cc02; }

  .mcard {
    width:64px; height:84px; border-radius:12px; background:#58cc02; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    box-shadow:0 4px 0 #46a302; font-weight:900; font-size:24px;
  }
  .mcard .dots { display:flex; flex-wrap:wrap; gap:2px; max-width:52px; justify-content:center; }
  .mcard .dots i { width:7px; height:7px; border-radius:50%; background:#fff; opacity:.9; }
  .mcard.click { cursor:pointer; }
  .mcard.good { background:#f2ffe8; color:#58cc02; box-shadow:0 4px 0 #cfe8b8; }
  .mcard.shake { animation:shake .4s; }
  .mrow { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* 找规律：图案序列 */
  .pat-row { display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .pat-cell {
    width:56px; height:56px; border-radius:14px; background:#fff; border:2px solid #e5e5e5;
    display:flex; align-items:center; justify-content:center; font-size:30px;
    box-shadow:0 3px 0 #e0e0e0;
  }
  .pat-cell.q { border-style:dashed; border-color:#ffc800; background:#fffbe8; }
  .pat-cell.q.good { border-style:solid; border-color:#58cc02; background:#f2ffe8; animation:pop .4s; }

  .clock { width:210px; height:210px; }

  /* ---------- 反馈条 ---------- */
  #feedback {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; padding:16px 20px 26px; z-index:20;
    font-size:18px; font-weight:900; display:none; border-radius:20px 20px 0 0;
  }
  #feedback.ok { display:block; background:#d7ffb8; color:#58a700; }
  #feedback.no { display:block; background:#ffd9b8; color:#cd7900; }

  /* ---------- 结算 ---------- */
  #screen-result { justify-content:center; align-items:center; padding:24px; }
  .result-card {
    background:#fff; border-radius:24px; padding:30px 26px; width:100%; max-width:360px;
    text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.1); display:flex; flex-direction:column; gap:14px;
  }
  .r-title { font-size:24px; font-weight:900; color:#3c3c3c; }
  .r-stars { font-size:44px; letter-spacing:6px; }
  .r-stars span { display:inline-block; animation:starin .5s backwards; }
  .r-stars span:nth-child(2){ animation-delay:.2s; } .r-stars span:nth-child(3){ animation-delay:.4s; }
  @keyframes starin { from { transform:scale(0) rotate(-90deg); opacity:0; } }
  .r-line { font-size:15px; font-weight:800; color:#8a8a8a; }
  .r-xp { font-size:18px; font-weight:900; color:#ff9600; }
  .r-btns { display:flex; gap:12px; justify-content:center; margin-top:6px; }
  .result-mascot { margin:0 auto -6px; }

  /* ---------- 评价手册 ---------- */
  #report-body { padding:18px 16px 40px; display:flex; flex-direction:column; gap:14px; }
  .rep-card { background:#fff; border-radius:18px; padding:16px; box-shadow:0 3px 10px rgba(0,0,0,.06); }
  .rep-h { font-weight:900; font-size:16px; margin-bottom:8px; color:#3c3c3c; }
  .rep-line { font-size:14px; font-weight:700; color:#777; line-height:1.8; }
  .rep-wrong { color:#cd7900; }
  .rep-tip { color:#58a700; }
  #toast {
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    background:#4b4b4b; color:#fff; font-weight:800; font-size:14px;
    padding:10px 18px; border-radius:20px; z-index:50; display:none;
  }
</style>
</head>
<body>
<div id="app">

  <!-- 地图 -->
  <div id="screen-map" class="screen">
    <header>
      <span id="hdr-thumb" class="thumb-badge">👍</span>
      <div class="xp-wrap">
        <div class="xp-bar"><div id="hdr-xp-fill"></div></div>
        <span id="hdr-xp-text"></span>
      </div>
      <button id="btn-voice" class="hdr-btn">🔊</button>
      <button id="btn-report" class="hdr-btn">📔 评价手册</button>
    </header>
    <div class="map-title">数学游戏盒 · 闯关地图</div>
    <div class="map-sub">改编自朱瑶《幼小衔接数学游戏盒》 · 全部通关解锁隐藏关</div>
    <div class="map-mascot-wrap" id="map-mascot"></div>
    <div id="path"></div>
    <footer>玩中长智慧 · 玩中共成长</footer>
  </div>

  <!-- 游戏 -->
  <div id="screen-game" class="screen hidden">
    <header class="game-hdr">
      <button id="btn-quit">✕</button>
      <div class="prog"><div id="game-prog-fill"></div></div>
      <div id="combo-badge" class="combo hidden"></div>
    </header>
    <div id="game-body"></div>
  </div>

  <!-- 结算 -->
  <div id="screen-result" class="screen hidden">
    <div id="result-body" class="result-card"></div>
  </div>

  <!-- 评价手册 -->
  <div id="screen-report" class="screen hidden">
    <header>
      <button id="btn-back-map">←</button>
      <div class="hdr-title">📔 评价手册</div>
    </header>
    <div id="report-body"></div>
  </div>

  <div id="feedback"></div>
  <div id="toast"></div>
</div>

<script>
"use strict";
/* ================= 数据 ================= */
const NODES = [
  { id:'bisize',  island:'green', icon:'⚖️', name:'比大小',        page:'P.15', game:'bisize'  },
  { id:'friends', island:'green', icon:'🤝', name:'朋友圈·凑10',   page:'P.16', game:'friends' },
  { id:'jielong', island:'green', icon:'🔢', name:'数字接龙',      page:'P.6',  game:'jielong' },
  { id:'clock',   island:'brown', icon:'🕐', name:'看时钟',        page:'P.28', game:'clock'   },
  { id:'coushu',  island:'green', icon:'➕', name:'凑数游戏',      page:'P.59', game:'coushu'  },
  { id:'missing', island:'blue',  icon:'🔍', name:'哪张牌不见了',  page:'P.52', game:'missing' },
  { id:'yapai',   island:'green', icon:'🃏', name:'压牌游戏',      page:'P.56', game:'yapai'   },
  { id:'laolang', island:'brown', icon:'🐺', name:'老狼几点钟',    page:'P.30', game:'laolang',  need:7  },
  { id:'guize',   island:'blue',  icon:'🧩', name:'接一接·找规律', page:'P.25', game:'guize',   need:8  },
];
const TIPS = {
  bisize:  '建议和孩子玩实体牌「比大小」，翻牌比数字，大的赢（评价手册 P.15）',
  friends: '建议和孩子玩实体牌「朋友圈」，凑10找朋友（评价手册 P.16）',
  clock:   '建议和孩子一起拨实物时钟、玩「老狼老狼几点钟」（评价手册 P.28/30）',
  missing: '建议和孩子玩实体牌「哪张牌不见了」，从5张开始（评价手册 P.52）',
  jielong: '建议和孩子玩实体牌「来接龙」，按数序从小到大或从大到小排（评价手册 P.6/46/47）',
  coushu:  '建议和孩子玩实体牌「凑数游戏」，先凑10再凑20（评价手册 P.59）',
  yapai:   '建议和孩子玩实体牌「压牌游戏」，体验输赢、学会表达情绪（评价手册 P.56/57）',
  laolang: '建议和孩子玩「老狼老狼几点钟」：老狼报时间，小朋友按时间躲起来（评价手册 P.30）',
  guize:   '建议和孩子玩「接一接·找规律」：用积木或扑克排出规律，让孩子接下去（评价手册 P.25）',
};
const KEY = 'mathbox_demo_v2';
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!S || typeof S !== 'object') {
  // 迁移旧版进度（mathbox_demo_v1），保留用户已有通关记录
  try {
    const old = JSON.parse(localStorage.getItem('mathbox_demo_v1'));
    if (old && typeof old === 'object' && old.stars) S = old;
  } catch(e) {}
}
if (!S || typeof S !== 'object') S = { stars:{}, xp:0, wrong:{} };
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

/* ================= 解锁逻辑（通关解锁，不再写死锁定） ================= */
function nodeLocked(n){
  if (!n.need) return false;             // 无 need 字段 → 直接可玩
  // 解锁条件：它前面的所有关卡（含隐藏关）都通关（有星星）
  const prev = NODES.slice(0, NODES.indexOf(n));
  const prevCleared = prev.every(x => (S.stars[x.id] || 0) > 0);
  return !prevCleared;
}

/* ================= 音效 ================= */
let AC = null;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t0, dur, type, vol){
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(vol || .22, c.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
}
const SFX = {
  click:  () => tone(600, 0, .08, 'triangle'),
  correct:() => { tone(523,0,.12); tone(659,.1,.12); tone(784,.2,.18); tone(1046,.3,.26); },
  wrong:  () => tone(196, 0, .25, 'square', .12),
  win:    () => [523,659,784,1047].forEach((f,i)=>tone(f, i*.12, .3)),
};

/* ================= 语音朗读（孩子识字少，全程语音） ================= */
let VOICE_ON = localStorage.getItem('mathbox_voice') !== 'off';
function speak(text){
  if (!VOICE_ON || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = .92;
    speechSynthesis.speak(u);
  } catch(e) {}
}

const $ = id => document.getElementById(id);

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ================= 游戏框架 ================= */
let G = null;
function startGame(node){
  SFX.click();
  G = { node, round:0, total:5, mistakes:0, combo:0, maxCombo:0, done:false, next:null };
  showScreen('game');
  $('game-prog-fill').style.width = '0%';
  $('combo-badge').classList.add('hidden');
  G.next = GAMES[node.game];
  speak(node.name + '，开始！');
  G.next();
}
function updateProg(){ $('game-prog-fill').style.width = (G.round / G.total * 100) + '%'; }
function updateCombo(){
  const b = $('combo-badge');
  if (G.combo >= 2) { b.textContent = '🔥连击 x' + G.combo; b.classList.remove('hidden'); }
  else b.classList.add('hidden');
}
function recordWrong(info){
  const arr = S.wrong[G.node.id] || (S.wrong[G.node.id] = []);
  arr.push(info); if (arr.length > 10) arr.shift();
  save();
}
function onAnswer(correct, wrongInfo){
  if (!G || G.done) return;
  if (correct) {
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    SFX.correct(); feedback(true, '答对啦！' + (G.combo>=2 ? ' 🔥x'+G.combo : ''));
    updateCombo();
    G.round++; updateProg();
    if (G.round >= G.total) { G.done = true; setTimeout(finish, 700); }
    else setTimeout(()=>{ if (G && !G.done) G.next(); }, 800);
  } else {
    G.mistakes++; G.combo = 0; updateCombo();
    SFX.wrong(); feedback(false);
    if (wrongInfo) recordWrong(wrongInfo);
  }
}
function finish(){
  const n = G.node;
  const stars = G.mistakes === 0 ? 3 : G.mistakes === 1 ? 2 : 1;
  S.stars[n.id] = Math.max(S.stars[n.id] || 0, stars);
  const xp = 10 + (G.mistakes === 0 ? 5 : 0) + G.maxCombo;
  S.xp += xp;
  save();
  SFX.win();
  const starHtml = [0,1,2].map(i => '<span style="color:' + (i < stars ? '#ffc800' : '#e5e5e5') + '">★</span>').join('');
  const unlockedNew = n.id === 'laolang' && stars > 0
    ? '<div class="r-line" style="color:#1cb0f6">🎉 老狼被唤醒！再接一关解锁「接一接·找规律」</div>'
    : n.id === 'guize' && stars > 0
      ? '<div class="r-line" style="color:#ce82ff">🎉 全部通关！你是数学小冠军！</div>' : '';
  $('result-body').innerHTML =
    '<div class="result-mascot"><div class="mascot" style="animation:mascot-jump .6s ease 3">' + foxSvg() + '</div></div>' +
    '<div class="r-title">🎉 过关！</div>' +
    '<div class="r-stars">' + starHtml + '</div>' +
    '<div class="r-line">' + n.icon + ' ' + n.name + ' · 评价手册 ' + n.page + '</div>' +
    '<div class="r-xp">经验 +' + xp + '　·　最高连击 x' + G.maxCombo + '</div>' +
    '<div class="r-line">' + (G.mistakes === 0 ? '零失误，太棒了！' : '失误 ' + G.mistakes + ' 次，再玩一次冲3星吧') + '</div>' +
    unlockedNew +
    '<div class="r-btns">' +
      '<button class="btn gray" id="btn-replay">再玩一次</button>' +
      '<button class="btn" id="btn-tomap">回地图</button>' +
    '</div>';
  showScreen('result');
  speak(stars === 3 ? '太棒啦，三颗星！' : '过关啦！');
  $('btn-replay').onclick = () => startGame(n);
  $('btn-tomap').onclick = () => { SFX.click(); renderMap(); showScreen('map'); };
}

function clockSVG(h){
  let marks = '';
  for (let i = 1; i <= 12; i++) {
    const a = (i*30 - 90) * Math.PI / 180;
    const x = 100 + 78*Math.cos(a), y = 100 + 78*Math.sin(a);
    marks += '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#8d6e63">'+i+'</text>';
  }
  const ha = (h % 12) * 30 * Math.PI / 180;
  const hx = 100 + 46*Math.sin(ha), hy = 100 - 46*Math.cos(ha);
  return '<svg viewBox="0 0 200 200" class="clock">' +
    '<circle cx="100" cy="100" r="95" fill="#fff" stroke="#b08968" stroke-width="7"/>' + marks +
    '<line x1="100" y1="100" x2="'+hx+'" y2="'+hy+'" stroke="#4b4b4b" stroke-width="9" stroke-linecap="round"/>' +
    '<line x1="100" y1="100" x2="100" y2="32" stroke="#e53935" stroke-width="4" stroke-linecap="round"/>' +
    '<circle cx="100" cy="100" r="7" fill="#4b4b4b"/></svg>';
}

  const lv = thumbLevel();
  $('hdr-thumb').className = 'thumb-badge' + (lv === 'gold' ? ' gold' : lv === 'silver' ? ' silver' : '');
  $('hdr-xp-fill').style.width = Math.min(100, S.xp) + '%';
  $('hdr-xp-text').textContent = S.xp >= 100 ? '👍金拇指!' : S.xp + '/100';
  const wave = [0, -70, 0, 70, 0, -70, 0, 70, 0];
  const currentId = (NODES.find(n => !nodeLocked(n) && !(S.stars[n.id] > 0)) || {}).id;
  $('path').innerHTML = NODES.map((n, i) => {
    const st = S.stars[n.id] || 0;
    const locked = nodeLocked(n);
    const cls = locked ? 'locked' : n.island + (n.id === currentId ? ' current' : '');
    const stars = st > 0
      ? '<div class="node-stars">' + [0,1,2].map(j => '<span style="color:' + (j < st ? '#ffc800' : '#ddd') + '">★</span>').join('') + '</div>'
      : '';
    const name = '<div class="node-name">' + n.name + '</div>';
    const bubble = n.id === currentId ? '<div class="start-bubble">开始</div>' : '';
    return '<div class="node-wrap" style="transform:translateX(' + wave[i % wave.length] + 'px)">' +
      bubble +
      '<button class="node ' + cls + '" data-id="' + n.id + '">' + (locked ? '🔒' : n.icon) + '</button>' +
      stars + name + '</div>';
  }).join('');
  document.querySelectorAll('.node').forEach(btn => {
    btn.onclick = () => {
      const n = NODES.find(x => x.id === btn.dataset.id);
      if (nodeLocked(n)) { SFX.wrong(); toast('先通过前面的关卡哦！'); return; }
      startGame(n);
    };
  });
  // 小狐狸在地图右下打招呼
  const mc = $('map-mascot');
  if (!mc.dataset.done) {
    renderMascot('map-mascot', '欢迎来到数学游戏盒！先玩比大小吧！');
  } else {
    // 已有 → 根据进度换一句鼓励
    const cleared = NODES.filter(n => !nodeLocked(n) && (S.stars[n.id]||0) > 0).length;
    if (cleared === 9 && !mc.dataset.greet9) { mc.dataset.greet9='1'; mascotSay(mc, '全部通关啦！你是数学小冠军！🏆'); speak('全部通关啦！你是数学小冠军！'); }
  }
}

/* ================= 评价手册 ================= */
function renderReport(){
  const lv = thumbLevel();
  let html =
    '<div class="rep-card"><div class="rep-h">👍 拇指进度</div>' +
    '<div class="rep-line">累计经验 ' + S.xp + '　·　' +
    (lv === 'gold' ? '已获得 <b style="color:#ffc800">金拇指</b>！超级大力士！' :
     lv === 'silver' ? '已获得 <b>银拇指</b>，再攒 ' + (100 - S.xp) + ' 经验点亮金拇指' :
     '攒到 50 经验点亮银拇指，100 经验点亮金拇指（还差 ' + (50 - S.xp) + '）') +
    '</div></div>';
  html += '<div class="rep-card"><div class="rep-h">⭐ 关卡精通</div>' +
    NODES.map(n => {
      const st = S.stars[n.id] || 0;
      const lock = nodeLocked(n);
      return '<div class="rep-line">' + n.icon + ' ' + n.name + '（' + n.page + '）：' +
        (lock ? '<span style="color:#bbb">🔒 未解锁</span>' :
         st > 0 ? [0,1,2].map(j => '<span style="color:' + (j < st ? '#ffc800' : '#ddd') + '">★</span>').join('') : '还没玩') +
        '</div>';
    }).join('') + '</div>';
  const wrongNodes = NODES.filter(n => (S.wrong[n.id] || []).length > 0);
  html += '<div class="rep-card"><div class="rep-h">✏️ 错题记录与建议</div>' +
    (wrongNodes.length === 0
      ? '<div class="rep-line">还没有错题记录，真棒！玩的时候答错会自动记在这里。</div>'
      : wrongNodes.map(n => {
          const arr = S.wrong[n.id];
          return '<div class="rep-line rep-wrong">' + n.icon + ' ' + n.name + '（' + n.page + '）错了 ' + arr.length + ' 次，最近：' + arr[arr.length-1] + '</div>' +
                 '<div class="rep-line rep-tip">💡 ' + TIPS[n.game] + '</div>';
        }).join('')) +
    '</div>';
  html += '<div class="rep-card"><div class="rep-line" style="text-align:center">' +
    '<button class="btn gray" id="btn-reset" style="font-size:13px;padding:9px 16px">重置进度</button></div></div>';
  $('report-body').innerHTML = html;
  $('btn-reset').onclick = () => {
    if (confirm('确定清空所有进度和记录吗？')) {
      S = { stars:{}, xp:0, wrong:{} }; save();
      renderReport(); renderMap(); toast('已重置');
    }
  };
}

/* ================= 事件 ================= */
$('btn-report').onclick = () => { SFX.click(); renderReport(); showScreen('report'); };
$('btn-voice').onclick = () => {
  VOICE_ON = !VOICE_ON;
  localStorage.setItem('mathbox_voice', VOICE_ON ? 'on' : 'off');
  refreshVoiceBtn();
  SFX.click();
  if (VOICE_ON) speak('语音朗读，开！');
  else toast('语音已关闭');
};
$('btn-back-map').onclick = () => { SFX.click(); renderMap(); showScreen('map'); };
$('btn-quit').onclick = () => { SFX.click(); G = null; renderMap(); showScreen('map'); };
document.addEventListener('touchstart', () => ac(), { once:true });
document.addEventListener('click', () => ac(), { once:true });

refreshVoiceBtn();
renderMap();
</script>
</body>
</html>
